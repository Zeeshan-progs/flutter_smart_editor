name: flutter_smart_editor
description: A pure Flutter rich text HTML editor with no WebView dependency. Fully customizable with granular settings for editor, toolbar, scroll, keyboard, selection, and styling.
version: 2.2.0
homepage: https://github.com/Zeeshan-progs/flutter_smart_editor

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_colorpicker: ^1.1.0
  html: ^0.15.4
  image_cropper: ^12.2.1
  image_picker: ^1.2.3
  meta: ">=1.0.0 <2.0.0"
  path_provider: ^2.1.6
  permission_handler: ^13.0.2
  super_clipboard: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^4.0.0

flutter:
